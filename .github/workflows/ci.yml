name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  # Both images are built on every push to main, whichever binary changed. They
  # share a go.mod, so a dependency bump touches both anyway and path filtering
  # would only save a minute.
  build-and-push:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        binary: [bridge, consumer]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          build-args: |
            BINARY=${{ matrix.binary }}
          tags: |
            ghcr.io/cujarrett/sump-pump-${{ matrix.binary }}:main
            ghcr.io/cujarrett/sump-pump-${{ matrix.binary }}:sha-${{ github.sha }}

  # The reusable workflow derives image and file from the repo name, which no
  # longer matches either image, so both are passed explicitly.
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        binary: [bridge, consumer]
    uses: cujarrett/homelab-workspaces/.github/workflows/update-image-tag.yml@main
    with:
      namespace: sump-pump
      image: ghcr.io/cujarrett/sump-pump-${{ matrix.binary }}
      file: sump-pump/sump-pump-${{ matrix.binary }}.yaml
    secrets:
      homelab_pat: ${{ secrets.HOMELAB_WORKSPACES_PAT }}
