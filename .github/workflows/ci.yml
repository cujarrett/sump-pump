name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  # Both images are built on every push to main, whichever binary changed. They
  # share a go.mod, so a dependency bump touches both anyway and path filtering
  # would only save a minute.
  build-and-push:
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        binary: [bridge, consumer]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: cujarrett/homelab/.github/workflows/build-image.yml@main
    with:
      image: ghcr.io/cujarrett/sump-pump-${{ matrix.binary }}
      tags: |
        ghcr.io/cujarrett/sump-pump-${{ matrix.binary }}:main
        ghcr.io/cujarrett/sump-pump-${{ matrix.binary }}:sha-${{ github.sha }}
      build-args: |
        BINARY=${{ matrix.binary }}
      cache-scope: ${{ matrix.binary }}

  # The reusable workflow derives image and file from the repo name, which no
  # longer matches either image, so both are passed explicitly.
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        binary: [bridge, consumer]
    uses: cujarrett/homelab-workspaces/.github/workflows/update-image-tag.yml@main
    with:
      namespace: sump-pump
      image: ghcr.io/cujarrett/sump-pump-${{ matrix.binary }}
      file: sump-pump/sump-pump-${{ matrix.binary }}.yaml
    secrets:
      app_private_key: ${{ secrets.HOMELAB_WORKSPACES_APP_KEY }}
